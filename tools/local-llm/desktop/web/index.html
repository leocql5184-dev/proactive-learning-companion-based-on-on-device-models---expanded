  <script>
    // The opening is independent of model readiness and only runs on a fresh page load.
    (() => {
      const opening = document.getElementById('opening');
      const skip = document.getElementById('opening-skip');
      const count = document.getElementById('opening-count');
      const phone = document.querySelector('.phone');
      const note = document.querySelector('.note');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let finished = false;
      let frame = 0;
      let deadlineTimer = 0;
      const start = performance.now();
      function finish() {
        if (finished) return;
        finished = true;
        cancelAnimationFrame(frame);
        clearTimeout(deadlineTimer);
        document.removeEventListener('visibilitychange', onVisibility);
        window.removeEventListener('pagehide', finish);
        opening.hidden = true;
        phone.inert = false;
        note.inert = false;
        document.body.classList.remove('intro-open');
        if (document.activeElement === skip) document.getElementById('resume-button').focus({ preventScroll: true });
      }
      function update() {
        if (finished) return;
        const elapsed = performance.now() - start;
        if (elapsed >= 4000) { finish(); return; }
        count.textContent = String(Math.max(1, Math.ceil((4000 - elapsed) / 1000)));
        if (elapsed >= 2800 && !reducedMotion.matches) opening.classList.add('is-dissolving');
        frame = requestAnimationFrame(update);
      }
      function onVisibility() {
        if (!document.hidden && performance.now() - start >= 4000) finish();
      }
      skip.addEventListener('click', finish);
      // Sample the actual paths so that the dust comes from the ink, not random confetti.
      try {
        const dust = document.getElementById('opening-dust');
        opening.querySelectorAll('.opening-line').forEach((path, line) => {
          const length = path.getTotalLength();
          for (let i = 0; i < 26; i++) {
            const point = path.getPointAtLength(length * (i + .3) / 26);
            const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            dot.setAttribute('class', 'opening-dust');
            dot.setAttribute('cx', point.x);
            dot.setAttribute('cy', point.y);
            dot.setAttribute('r', i % 4 === 0 ? '1.1' : '.65');
            dot.style.setProperty('--dx', `${10 + (i * 7 % 23)}px`);
            dot.style.setProperty('--dy', `${-12 - (i * 11 % 26)}px`);
            if (line) dot.style.fill = '#79828d';
            dust.appendChild(dot);
          }
        });
      } catch (_) { /* The timed entry and skip still work without SVG geometry support. */ }
      opening.hidden = false;
      phone.inert = true;
      note.inert = true;
      document.body.classList.add('intro-open');
      skip.focus({ preventScroll: true });
      document.addEventListener('visibilitychange', onVisibility);
      window.addEventListener('pagehide', finish);
      deadlineTimer = setTimeout(finish, 4000);
      frame = requestAnimationFrame(update);
    })();
  </script>
